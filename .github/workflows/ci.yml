name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: pip install --require-hashes -r backend/requirements-build.lock -r backend/requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e './backend[dev]'
      - run: pip check
      - run: ruff check backend
      - run: ruff check --config backend/pyproject.toml scripts/ci_environment.py scripts/ci_smoke.py scripts/ci_health.py scripts/ci_first_owner.py scripts/test_ci_contracts.py
      - run: pytest backend/tests --cov=app --cov-report=term-missing
      - run: python -m unittest discover -s scripts -p 'test_ci_*.py'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: signalgraph-ci-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_BASE_URL: http://127.0.0.1:8080
      E2E_EMAIL: admin@example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create isolated synthetic configuration
        run: python3 scripts/ci_environment.py
      - run: docker compose config --quiet
      - name: Start all six services from empty volumes
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check runtime images for fixable high and critical advisories
        run: |
          for service in api frontend; do
            image_id=$(docker compose images -q "$service")
            test -n "$image_id"
            docker save --output "$RUNNER_TEMP/sg-$service.tar" "$image_id"
            docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP:/audit" -e TRIVY_CACHE_DIR=/audit/trivy-cache aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --input "/audit/sg-$service.tar" --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --timeout 10m
          done
      - name: Verify migration and empty first-run state
        run: docker compose exec -T api python -c "from app.database import engine; from sqlalchemy import text; c=engine.connect(); assert c.execute(text('select version_num from alembic_version')).scalar_one() == '0001'; assert c.execute(text('select count(*) from users')).scalar_one() == 0"
      - name: Verify concurrent terminal ownership and seed synthetic evidence
        run: |
          docker compose cp scripts/ci_first_owner.py api:/tmp/ci_first_owner.py
          docker compose exec -T -e SIGNALGRAPH_DISPOSABLE_CI=true -e E2E_EMAIL="$E2E_EMAIL" -e E2E_PASSWORD="$E2E_PASSWORD" api python /tmp/ci_first_owner.py
          docker compose exec -T api signalgraph seed-demo --email "$E2E_EMAIL"
          docker compose exec -T api signalgraph doctor
      - name: Verify real queue round trip without external collection
        run: docker compose exec -T api python -c "from app.tasks import collector_health; result=collector_health.delay().get(timeout=30); assert isinstance(result, dict) and len(result) >= 4; print('Synthetic queue round trip passed')"
      - name: Check readiness and authentication boundaries
        run: python3 scripts/ci_smoke.py
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run existing analyst workflows against the production stack
        run: npm run test:e2e
        working-directory: frontend
      - name: Record status without environment or credentials
        if: always()
        run: python3 scripts/ci_health.py
      - name: Publish bounded synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-health.json
            frontend/test-results/**/*.png
          retention-days: 7
          include-hidden-files: false
          overwrite: false
          archive: true
          if-no-files-found: warn
      - name: Remove only this job's disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
