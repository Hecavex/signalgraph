name: Bug report
description: Report a reproducible SignalGraph defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SignalGraph. Do not include credentials, private intelligence, or vulnerability details in a public issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no secrets, sensitive intelligence, or private vulnerability details.
          required: true
  - type: input
    id: version
    attributes:
      label: SignalGraph version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Docker/Compose versions, and browser when relevant
      placeholder: Windows 11, Docker Desktop 29, Chrome 140
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Describe the smallest reliable sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, credentials, internal hostnames, private indicators, and personal data.
      render: shell
